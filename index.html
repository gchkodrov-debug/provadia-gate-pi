<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GATE OF PROVADIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #141210; font-family: 'Inter', sans-serif; color: #F4EFE6; }
        canvas { display: block; }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.7) 100%); z-index: 10; }
        #blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; pointer-events: none; transition: opacity 2.6s ease-in-out; }
        .overlay { position: fixed; opacity: 0; transition: opacity 1.5s ease-out; pointer-events: none; z-index: 20; }
        #header { top: 5%; left: 50%; transform: translateX(-50%); text-align: center; }
        #header h1 { font-family: 'Cinzel', serif; color: #FFEFC1; font-size: 3rem; letter-spacing: 0.4rem; margin: 0; }
        #header p { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2rem; opacity: 0.8; margin-top: 0.5rem; }
        #footer-left { bottom: 5%; left: 5%; text-align: left; }
        #footer-left .title { font-family: 'Cinzel', serif; color: #C9A227; font-size: 1.2rem; }
        #footer-left .stat { font-size: 0.9rem; opacity: 0.7; }
        #footer-right { bottom: 5%; right: 5%; text-align: right; font-size: 0.8rem; opacity: 0.5; }
        #controls { bottom: 5%; left: 50%; transform: translateX(-50%); pointer-events: auto; }
        #flip-btn { background: transparent; border: 1px solid #C9A227; color: #FFEFC1; padding: 0.6rem 1.5rem; font-family: 'Cinzel', serif; cursor: pointer; transition: all 0.3s; letter-spacing: 0.1rem; }
        #flip-btn:hover { background: #C9A227; color: #141210; }
        .visible { opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="blackout"></div>
    <div id="vignette"></div>
    <div id="header" class="overlay">
        <h1>PROVADIA</h1>
        <p>THE GATE · EUROPE'S FIRST TOWN OF RECORD</p>
    </div>
    <div id="footer-left" class="overlay">
        <div class="title">THE GOLDEN WALL</div>
        <div class="stat">0 / 47 bricks laid · one is waiting</div>
    </div>
    <div id="footer-right" class="overlay">TAP THE COIN</div>
    <div id="controls" class="overlay">
        <button id="flip-btn">FLIP THE COIN</button>
    </div>

    <script type="module">
        import * as THREE from './three.module.min.js';

        // --- CONFIG ---
        const PALETTE = { field: '#141210', gold1: '#C9A227', gold2: '#FFEFC1', gold3: '#6B4A12', gold4: '#3D2A08', salt: '#F4EFE6' };
        const FLIGHT_DURATION = 10.5;
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(PALETTE.field);
        scene.fog = new THREE.FogExp2(PALETTE.field, 0.028);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
        keyLight.position.set(-5, 10, 5);
        keyLight.castShadow = true;
        keyLight.shadow.camera.left = -10; keyLight.shadow.camera.right = 10;
        keyLight.shadow.camera.top = 10; keyLight.shadow.camera.bottom = -10;
        scene.add(keyLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x000000, 0.2);
        scene.add(hemiLight);

        const emberLight = new THREE.PointLight(PALETTE.gold1, 2, 8);
        emberLight.position.set(0, 2, 2);
        scene.add(emberLight);

        // --- GROUND ---
        const groundGeo = new THREE.CircleGeometry(50, 64);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.62;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- THE GATE ---
        const gateGroup = new THREE.Group();
        const pillarGeo = new THREE.BoxGeometry(1.5, 8.6, 1.5);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        const trimMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold1 });

        const createPillar = (x) => {
            const p = new THREE.Mesh(pillarGeo, pillarMat);
            p.position.set(x, 3.7, 7);
            p.castShadow = true;
            
            const trim = new THREE.Mesh(new THREE.BoxGeometry(0.1, 8.6, 0.1), trimMat);
            trim.position.set(x * 1.05, 3.7, 7);
            
            const cap = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.2, 1.7), trimMat);
            cap.position.set(x, 8, 7);
            
            return new THREE.Group().add(p, trim, cap);
        };
        // Note: Group.add only takes one arg in some versions, fixing to multiple calls
        const pLeft = new THREE.Group(); pLeft.add(createPillar(-4.1).children[0]); // simplify
        // Re-doing gate structure cleanly
        const pL = new THREE.Mesh(pillarGeo, pillarMat); pL.position.set(-4.1, 3.7, 7); pL.castShadow=true; scene.add(pL);
        const pR = new THREE.Mesh(pillarGeo, pillarMat); pR.position.set(4.1, 3.7, 7); pR.castShadow=true; scene.add(pR);
        const lGeo = new THREE.BoxGeometry(9.5, 1, 1.5);
        const lintel = new THREE.Mesh(lGeo, pillarMat); lintel.position.set(0, 8, 7); lintel.castShadow=true; scene.add(lintel);
        const lTrim = new THREE.Mesh(new THREE.BoxGeometry(9.7, 0.2, 1.7), trimMat); lTrim.position.set(0, 8.5, 7); scene.add(lTrim);

        // --- THE COIN ---
        const coinGroup = new THREE.Group();
        coinGroup.position.set(0, 2.35, 0);
        scene.add(coinGroup);

        const coinGeo = new THREE.CylinderGeometry(2, 2, 0.36, 64);
        const coinMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold1, metalness: 0.8, roughness: 0.2 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.castShadow = true;
        coinGroup.add(coin);

        // Front relief (+z)
        const reliefGroup = new THREE.Group();
        reliefGroup.position.z = 0.19;
        coinGroup.add(reliefGroup);

        // Bricks
        for(let i=0; i<5; i++) {
            for(let j=0; j<3; j++) {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), trimMat);
                b.position.set((j-1)*0.5, -0.5 + i*0.2, 0);
                reliefGroup.add(b);
            }
        }
        // Merlons (7)
        for(let i=0; i<7; i++) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), trimMat);
            const angle = (i / 6) * Math.PI - Math.PI/2;
            m.position.set(Math.cos(angle)*1.8, Math.sin(angle)*1.8, 0);
            m.rotation.z = angle + Math.PI/2;
            reliefGroup.add(m);
        }
        // Rim Spheres (47)
        for(let i=0; i<47; i++) {
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), trimMat);
            const angle = (i / 46) * Math.PI * 2;
            s.position.set(Math.cos(angle)*1.76, Math.sin(angle)*1.76, 0);
            reliefGroup.add(s);
        }

        // Back relief (-z)
        const backGroup = new THREE.Group();
        backGroup.position.z = -0.19;
        backGroup.rotation.y = Math.PI;
        coinGroup.add(backGroup);

        const sun = new THREE.Mesh(new THREE.CircleGeometry(0.8, 32), new THREE.MeshStandardMaterial({ color: PALETTE.gold2, emissive: PALETTE.gold3, emissiveIntensity: 0.5 }));
        backGroup.add(sun);

        for(let i=1; i<=3; i++) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(i*0.4, 0.03, 16, 64), trimMat);
            backGroup.add(ring);
        }
        for(let i=0; i<47; i++) {
            const bead = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), trimMat);
            const angle = (i / 46) * Math.PI * 2;
            bead.position.set(Math.cos(angle)*1.5, Math.sin(angle)*1.5, 0);
            backGroup.add(bead);
        }

        // --- GOLDEN WALL ---
        const wallCanvas = document.createElement('canvas');
        wallCanvas.width = 2048; wallCanvas.height = 768;
        const ctx = wallCanvas.getContext('2d');
        ctx.fillStyle = PALETTE.field;
        ctx.fillRect(0, 0, 2048, 768);
        ctx.strokeStyle = PALETTE.gold3;
        ctx.lineWidth = 2;
        
        const slots = [];
        for(let r=0; r<4; r++) {
            const cols = r < 3 ? 12 : 11;
            for(let c=0; c<cols; c++) {
                const x = 200 + c * 130;
                const y = 150 + r * 140;
                ctx.strokeRect(x, y, 80, 60);
                slots.push({x: x/2048*27 - 13.5, y: -y/768*10.1 + 5.05});
            }
        }
        const wallTex = new THREE.CanvasTexture(wallCanvas);
        const wallGeo = new THREE.PlaneGeometry(27, 10.1);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, transparent: true });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.z = -8.5;
        scene.add(wall);

        const waitBrickGeo = new THREE.PlaneGeometry(0.8, 0.6);
        const waitBrickMat = new THREE.MeshBasicMaterial({ color: PALETTE.gold2, transparent: true, opacity: 0.5 });
        const waitBrick = new THREE.Mesh(waitBrickGeo, waitBrickMat);
        waitBrick.position.set(slots[0].x, slots[0].y, -8.49);
        scene.add(waitBrick);
        const waitEdges = new THREE.EdgesGeometry(waitBrickGeo);
        const waitLine = new THREE.LineSegments(waitEdges, new THREE.LineBasicMaterial({ color: PALETTE.gold2 }));
        waitBrick.add(waitLine);

        // --- SALT DUST ---
        const dustCanvas = document.createElement('canvas');
        dustCanvas.width = 32; dustCanvas.height = 32;
        const dctx = dustCanvas.getContext('2d');
        const grad = dctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, PALETTE.salt);
        grad.addColorStop(1, 'transparent');
        dctx.fillStyle = grad;
        dctx.fillRect(0,0,32,32);
        const dustTex = new THREE.CanvasTexture(dustCanvas);
        
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(380 * 3);
        for(let i=0; i<380*3; i++) dustPos[i] = (Math.random()-0.5)*20;
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({ size: 0.15, map: dustTex, transparent: true, opacity: 0.6, depthWrite: false });
        const dust = new THREE.Points(dustGeo, dustMat);
        scene.add(dust);

        // --- CAMERA FLIGHT ---
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 2.35, 31),
            new THREE.Vector3(0, 2.35, 15),
            new THREE.Vector3(0, 2.35, 7),
            new THREE.Vector3(0, 2.35, 6.4)
        ]);

        const urlParams = new URLSearchParams(window.location.search);
        const shotParam = urlParams.get('shot');
        let flightProgress = 0;
        let isFrozen = shotParam !== null;
        if(isFrozen) flightProgress = parseFloat(shotParam);

        // --- INTERACTION ---
        let isFlipping = false;
        let flipRot = 0;
        const triggerFlip = () => {
            if(isFlipping) return;
            isFlipping = true;
            const start = performance.now();
            const duration = 1500;
            const startRot = coinGroup.rotation.y;
            
            const animateFlip = (now) => {
                const elapsed = now - start;
                const t = Math.min(elapsed / duration, 1);
                const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
                coinGroup.rotation.y = startRot + ease * Math.PI;
                if(t < 1) requestAnimationFrame(animateFlip);
                else isFlipping = false;
            };
            requestAnimationFrame(animateFlip);
        };

        document.getElementById('flip-btn').onclick = triggerFlip;
        renderer.domElement.onclick = (e) => {
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            if(raycaster.intersectObject(coin, true).length > 0) triggerFlip();
        };

        // --- RENDER LOOP ---
        let startTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const elapsed = (now - startTime) / 1000;

            if(!isFrozen) {
                flightProgress = Math.min(elapsed / FLIGHT_DURATION, 1);
            }

            const t = flightProgress;
            const smoothT = t * t * (3 - 2 * t); // smootherstep
            const pos = curve.getPointAt(smoothT);
            camera.position.copy(pos);
            camera.lookAt(0, 2.35, 0);

            if(t >= 1) {
                camera.position.y += Math.sin(now * 0.001) * 0.05;
                camera.position.x += Math.cos(now * 0.0015) * 0.03;
            }

            // UI Fade
            if(t > 0.86) {
                document.querySelectorAll('.overlay').forEach(el => el.classList.add('visible'));
            }

            // Coin Idle
            if(!isFlipping) {
                coinGroup.position.y = 2.35 + Math.sin(now * 0.002) * 0.05;
                coinGroup.rotation.y += 0.002;
            }

            // Wait Brick pulse
            waitBrick.material.opacity = 0.3 + Math.sin(now * 0.003) * 0.2;

            // Dust drift
            dust.position.y += 0.002;
            if(dust.position.y > 5) dust.position.y = -5;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setTimeout(() => { document.getElementById('blackout').style.opacity = '0'; }, 100);
        animate();
    </script>
</body>
</html>
